name: GMGN - Server tests and image
on:
  push:
    paths: ['gmgn-live/**', '.github/workflows/gmgn-live.yml']
  pull_request:
    paths: ['gmgn-live/**', '.github/workflows/gmgn-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gmgn-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Test server control panel with a fixture backend
        run: node scripts/ui-check.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GMGN-server-browser-checks
          path: gmgn-live/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build inactive deployment image
        run: docker build -t hengki-gmgn-live:check .
      - name: Validate compose structure
        run: |
          node scripts/setup.mjs
          docker compose --env-file .env config --quiet
